<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>FutureOS</title><style>body{font-family:sans-serif;background:#0b0c15;color:#e8eaff;padding:2rem}h1{font-weight:300}button{padding:.5rem 1rem;background:#3b82f6;color:#fff;border:none;border-radius:.25rem}section{margin:1.5rem 0;padding:1rem;background:#15162b;border-radius:.5rem}</style></head><body>
<h1>FutureOS</h1><p>Simule decisões antes de vivê-las.</p>
<section><h2>1. População</h2><button onclick="loadPop()">Gerar população (fake)</button><pre id="pop"></pre></section>
<section><h2>2. Cenário</h2><button onclick="loadScenario()">Carregar pricing scenario</button><pre id="scen"></pre></section>
<section><h2>3. Experimento</h2><button onclick="runExp()">Simular futuros</button><pre id="res"></pre></section>
<script>function loadPop(){fetch("/api/population/plan",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({description:"restaurantes pequenos",size:8,provider:"fake"})}).then(r=>r.json()).then(j=>document.getElementById("pop").textContent=JSON.stringify(j,null,2))} function loadScenario(){fetch("/api/scenario/validate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:"pricing",name:"pricing",description:"d",initial_state:{price:70},duration_ticks:30,branches:[{id:"A",name:"stay"},{id:"B",name:"up",interventions:[{type:"PRICE_CHANGE",tick:1,payload:{price:100}}]}],source:"manual"})}).then(r=>r.json()).then(j=>document.getElementById("scen").textContent=JSON.stringify(j,null,2))} function runExp(){document.getElementById("res").textContent="Running..."; fetch("/api/experiments",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({scenario:{id:"pricing",name:"pricing",description:"d",initial_state:{price:70},duration_ticks:30,branches:[{id:"A",name:"stay"},{id:"B",name:"up",interventions:[{type:"PRICE_CHANGE",tick:1,payload:{price:100}}]}],source:"manual"},seeds:[2026]})}).then(r=>r.json()).then(j=>document.getElementById("res").textContent=JSON.stringify(j,null,2))}</script></body></html>
